# Fork (tiger-git2022/s1-next): follow upstream.
#
# Upstream (ykrank/S1-Next) develops on `master` and does not publish every version as a GitHub
# Release, so this follows that branch instead of release tags.
#
# Every 6 hours, merge upstream `master` into `custom`. If the merge is clean and the app
# builds, push it and publish a new release. Otherwise push nothing and open an issue with the
# conflicting files or the build log.
#
# Scheduled workflows only run from the default branch, so `custom` must be the default branch.
name: Tiger Sync Upstream

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tiger-sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: ykrank/S1-Next
  UPSTREAM_BRANCH: master
  TARGET_BRANCH: custom

jobs:
  sync:
    name: Merge upstream master
    runs-on: ubuntu-26.04
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          # Optional PAT (contents + workflows write). Without it the push uses GITHUB_TOKEN.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Check upstream
        id: check
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          head=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Upstream $UPSTREAM_BRANCH is at $head"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "upstream/$UPSTREAM_BRANCH is already part of $TARGET_BRANCH, nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.check.outputs.needed == 'true'
        env:
          HEAD_SHA: ${{ steps.check.outputs.head }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-ff --no-commit "upstream/$UPSTREAM_BRANCH"

          # Upstream's workflows never land in this fork: pushing workflow changes needs a token
          # with the "workflows" permission, and this fork has its own.
          git rm -r -q -f --cached --ignore-unmatch -- .github/workflows
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows

          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicts" ]; then
            echo "Merge conflicts:"
            echo "$conflicts"
            echo "$conflicts" > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --no-edit -m "合并上游 $UPSTREAM_BRANCH ($HEAD_SHA) / Merge upstream $UPSTREAM_BRANCH ($HEAD_SHA) into $TARGET_BRANCH"
          echo "result=merged" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.merge.outputs.result == 'merged'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        if: steps.merge.outputs.result == 'merged'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        id: build
        if: steps.merge.outputs.result == 'merged'
        run: |
          set -o pipefail
          ./gradlew :app:assembleNormalCustom 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Push
        id: push
        if: steps.merge.outputs.result == 'merged' && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          git push origin "HEAD:$TARGET_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Upload build log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-sync-build-log
          path: ${{ runner.temp }}/build.log

      - name: Open issue
        if: >-
          always() && steps.check.outputs.needed == 'true' &&
          steps.push.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.check.outputs.head }}
          MERGE_RESULT: ${{ steps.merge.outputs.result }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue.md"
          {
            echo "自动合并上游 [\`$UPSTREAM_BRANCH\` @ $HEAD_SHA](https://github.com/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH) 到 \`$TARGET_BRANCH\` 失败，没有推送任何改动。"
            echo
            echo "工作流运行：$RUN_URL"
            echo
            if [ "$MERGE_RESULT" = "conflict" ]; then
              echo "### 冲突文件"
              echo
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            elif [ "$BUILD_OUTCOME" = "failure" ]; then
              echo "### 编译失败"
              echo
              echo "合并本身没有冲突。完整日志见运行页面的 artifact \`upstream-sync-build-log\`，最后 150 行："
              echo
              echo '<details><summary>build.log</summary>'
              echo
              echo '```'
              tail -n 150 "$RUNNER_TEMP/build.log" | cut -c 1-300
              echo '```'
              echo
              echo '</details>'
            elif [ "$PUSH_OUTCOME" = "failure" ]; then
              echo "### 推送失败"
              echo
              echo "合并和编译都成功了，但推送被拒绝。如果上游改动了 \`.github/workflows\`，GITHUB_TOKEN 没有推送权限，"
              echo "需要在仓库 Secrets 里配置 \`SYNC_TOKEN\`（有 Contents 和 Workflows 写权限的 PAT）。"
            else
              echo "### 工作流在合并前出错"
              echo
              echo "请查看运行日志。"
            fi
            echo
            echo "### 手动处理"
            echo
            echo '```sh'
            echo "git fetch https://github.com/$UPSTREAM_REPO.git $UPSTREAM_BRANCH"
            echo "git checkout $TARGET_BRANCH"
            echo "git merge --no-ff FETCH_HEAD"
            echo "# 上游的工作流文件不要合进来："
            echo "git rm -r -q -f --cached --ignore-unmatch -- .github/workflows && rm -rf .github/workflows && git checkout HEAD -- .github/workflows"
            echo '```'
          } > "$body"

          title="Upstream sync failed: $UPSTREAM_BRANCH"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi

  release:
    name: Release
    needs: sync
    if: needs.sync.outputs.pushed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/tiger-release.yml
    with:
      ref: custom
    secrets: inherit
